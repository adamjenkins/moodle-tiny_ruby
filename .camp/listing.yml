name: tiny_ruby
summary: 'A TinyMCE editor plugin for adding and editing furigana markup for the Ruby (furigana) filter, and copying a text''s readings as a word list.'
description: |
  A companion to the Ruby (furigana) filter (filter_ruby), which it requires.
  It adds two editor tools for teachers writing Japanese content:

  - Furigana: a dialog that adds, changes or removes the filter's inline markup
    on the selected word, in brace or Aozora Bunko syntax (a site setting).
  - Furigana word list: collects every reading in the text as a word=reading
    list, ready to paste into a course word list of the filter.
